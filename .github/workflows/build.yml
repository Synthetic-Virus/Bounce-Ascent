name: Build

# Builds Windows, Android and iOS on every push to main, and on demand.
#
# BUILD TIME
# ----------
# The slow part is the 800MB export-template download, so it is cached by Godot
# version and only re-fetched when that changes. Windows and Android build on
# Linux; iOS needs macOS. The repository is PUBLIC, so all standard GitHub
# runners are free here, macOS included, and the iOS job is not held back for
# cost reasons. It stays independent and continue-on-error only so a broken
# Apple toolchain never blocks a perfectly good Windows and Android build.
#
# (If this repo is ever made private, that changes: macOS then bills at 10x the
# Linux minute rate and this job becomes the expensive one.)
#
# The project is pure GDScript with no addons and no imported assets, so the
# export itself takes seconds. Tests are not run here by design.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Standard (non-.NET) Godot: the project uses no C#, and the standard
  # templates are ~400MB smaller than the mono ones.
  GODOT_VERSION: 4.7
  GODOT_RELEASE: stable

jobs:
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import project
        # Godot needs one import pass to build the class cache before it can
        # export. Headless exits non-zero on some import warnings, so the
        # result is checked by whether the export succeeds, not by this step.
        run: |
          ~/godot/godot --headless --import --path . || true

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/BounceAscent.exe
          test -s build/BounceAscent.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/BounceAscent.exe
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Create a debug keystore
        # Unsigned APKs cannot be installed at all, so CI signs with a generated
        # debug key. This is for testing only: a Play Store upload needs a real
        # upload key added as a secret.
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the SDK and keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot/godot --headless --import --path . || true

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/BounceAscent.apk
          test -s build/BounceAscent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/BounceAscent.apk
          retention-days: 30

  ios:
    name: iOS
    # Independent of the other two so an Apple toolchain problem cannot block
    # them. Free on this public repo, see the note at the top of the file.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import project
        run: |
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --import --path . || true

      # Signing turns itself on when the secrets exist. Nothing here needs
      # editing when the Apple Developer enrolment completes: add the four
      # repository secrets and the next run produces a signed .ipa instead of
      # a bare Xcode project. See docs/IOS_SIGNING.md.
      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERT_P12 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present: producing a signed build."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: producing an unsigned Xcode project."
          fi

      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          # A dedicated, throwaway keychain: never touch the runner default.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Apply the real Team ID
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The preset ships a placeholder so the unsigned export validates.
          sed -i '' "s/application\/app_store_team_id=\".*\"/application\/app_store_team_id=\"$TEAM\"/" export_presets.cfg
          sed -i '' 's/application\/export_project_only=true/application\/export_project_only=false/' export_presets.cfg
          grep -E "app_store_team_id|export_project_only" export_presets.cfg

      - name: Import project
        run: |
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --import --path . || true

      - name: Export
        # Unsigned: emits an Xcode project and stops, because archiving needs a
        # signing identity. Signed: archives through to an installable .ipa.
        run: |
          set -euo pipefail
          mkdir -p build/ios
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "iOS" build/ios/BounceAscent.xcodeproj
          ls -laR build/ios | head -40

      # Build an INSTALLABLE .ipa even with no Apple account.
      #
      # Godot stops at the Xcode project when unsigned, and an Xcode project is
      # useless without a Mac. But signing is applied to the compiled app, not
      # baked into compilation, so Xcode will happily build the binary with
      # signing switched off entirely. An .ipa is then just a zip containing
      # Payload/<App>.app, which we assemble by hand: -exportArchive exists
      # mainly to SIGN, and we have nothing to sign with.
      #
      # The result installs via Sideloadly or AltStore, which re-sign it on the
      # user's own machine with an ordinary Apple ID. With a free account that
      # lasts 7 days; with a paid one, a year.
      #
      # CODE_SIGN_ENTITLEMENTS is cleared as well as the identity. Godot emits
      # an entitlements file, and entitlements are meaningless to an unsigned
      # binary: leaving it set makes some Xcode versions demand a signing
      # identity for a build that was explicitly told not to sign.
      - name: Package an unsigned .ipa
        if: steps.signing.outputs.enabled != 'true'
        working-directory: build/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project BounceAscent.xcodeproj \
            -scheme BounceAscent \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          APP="$(find dd/Build/Products -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app was produced; the build succeeded but emitted nothing."
            find dd/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Packaging $APP"

          # An .ipa is a zip whose payload lives in a directory literally named
          # Payload. The name is not a convention, it is load-bearing.
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry BounceAscent-unsigned.ipa Payload
          test -s BounceAscent-unsigned.ipa
          ls -la BounceAscent-unsigned.ipa

      - name: Upload the unsigned .ipa
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/BounceAscent-unsigned.ipa
          retention-days: 30

      # The Xcode project is uploaded regardless. It is the thing to open on a
      # Mac, and it is also the fallback if the unsigned packaging above ever
      # breaks. Artifact storage is free on a public repo.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.signing.outputs.enabled == 'true' && 'signed-ipa' || 'xcodeproj-unsigned' }}
          path: |
            build/ios
            !build/ios/dd
            !build/ios/Payload
          retention-days: 30
