name: Build

# Builds Windows, Android and iOS on every push to main, and on demand.
#
# BUILD TIME
# ----------
# The slow part is the 800MB export-template download, so it is cached by Godot
# version and only re-fetched when that changes. Windows and Android both build
# on free Linux runners; only iOS needs macOS, which bills at 10x the minute
# rate, so it runs LAST and independently. A failure there never blocks the two
# cheap builds.
#
# The project is pure GDScript with no addons and no imported assets, so the
# export itself takes seconds. Tests are not run here by design.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Standard (non-.NET) Godot: the project uses no C#, and the standard
  # templates are ~400MB smaller than the mono ones.
  GODOT_VERSION: 4.7
  GODOT_RELEASE: stable

jobs:
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import project
        # Godot needs one import pass to build the class cache before it can
        # export. Headless exits non-zero on some import warnings, so the
        # result is checked by whether the export succeeds, not by this step.
        run: |
          ~/godot/godot --headless --import --path . || true

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/BounceAscent.exe
          test -s build/BounceAscent.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/BounceAscent.exe
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Create a debug keystore
        # Unsigned APKs cannot be installed at all, so CI signs with a generated
        # debug key. This is for testing only: a Play Store upload needs a real
        # upload key added as a secret.
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the SDK and keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot/godot --headless --import --path . || true

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/BounceAscent.apk
          test -s build/BounceAscent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/BounceAscent.apk
          retention-days: 30

  ios:
    name: iOS (unsigned)
    # macOS runners bill at 10x, so this is deliberately independent of the
    # cheap builds and does not gate them.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-std

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import project
        run: |
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --import --path . || true

      - name: Export Xcode project
        # UNSIGNED. Produces an Xcode project, not an installable .ipa, because
        # signing needs a paid Apple Developer Program membership. The preset
        # sets export_project_only so Godot stops after generating the project
        # rather than attempting an archive it cannot sign.
        #
        # To turn on signing later, add these repository secrets and set
        # application/app_store_team_id in export_presets.cfg:
        #   APPLE_TEAM_ID, APPLE_CERT_P12, APPLE_CERT_PASSWORD,
        #   APPLE_PROVISIONING_PROFILE
        # then import the cert into the keychain and run xcodebuild archive.
        run: |
          set -euo pipefail
          mkdir -p build/ios
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "iOS" build/ios/BounceAscent.xcodeproj
          ls -la build/ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcodeproj-unsigned
          path: build/ios
          retention-days: 30
