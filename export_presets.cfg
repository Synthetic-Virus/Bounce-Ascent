[preset.2.options]

custom_template/debug=""
custom_template/release=""
architectures/device=true
architectures/simulator=false
; PLACEHOLDER. Godot validates this field and refuses the iOS export without
; it, even for an unsigned build that only emits an Xcode project. Replace with
; the real ten-character Team ID from developer.apple.com once enrolled; until
; then the generated project builds but cannot be signed or installed.
application/app_store_team_id="0000000000"
application/bundle_identifier="org.virusgaming.bounceascent"
application/signature=""
; 1.0 on iOS while everything else is 2.0.0, deliberately.
;
; CFBundleShortVersionString must match the version being prepared in App Store
; Connect, and that record was created as 1.0 and cannot be edited afterwards.
; Changing the build is the only side of that pair that can move.
;
; The divergence is not really a divergence: the App Store version namespace is
; independent and starts here. 2.0.0 elsewhere counts a 2025 original nobody on
; the App Store has ever seen, so presenting the debut as 1.0 is also the more
; honest number for that audience.
;
; A future release just needs both raised together.
application/short_version="1.0"
; CFBundleVersion, the BUILD number. CI overwrites this with the workflow run
; number when uploading, because App Store Connect refuses a build number it has
; already seen. The value here only applies to local builds.
application/version="2.0.0"
; Export compliance, answered once here instead of by hand on every upload.
;
; App Store Connect asks whether the app uses encryption on EVERY build
; otherwise, and an unanswered build will not go to review. False is accurate:
; the game ships no cryptography of its own, makes no network calls at all, and
; encrypt_pck is off above. Revisit this if any of those three change.
application/additional_plist_content="<key>ITSAppUsesNonExemptEncryption</key>
<false/>"
application/is_resizable=false
application/icon_interpolation=4
application/launch_screens_interpolation=4
; TRUE so Godot emits the Xcode project and STOPS.
;
; With this false it goes on to run `xcodebuild archive`, which cannot succeed
; without a signing identity and failed CI with "ARCHIVE FAILED". Exporting the
; project only is exactly what an unsigned pipeline should produce: something
; you can open in Xcode and sign yourself once enrolled.
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
; MANUAL code signing, filled in by CI. Empty here on purpose.
;
; Godot writes CODE_SIGN_STYLE = Automatic when no provisioning profile UUID is
; configured, while still writing CODE_SIGN_IDENTITY = "Apple Distribution" for
; the release config. Xcode rejects that pair outright:
;
;   "BounceAscent is automatically signed for development, but a conflicting
;    code signing identity Apple Distribution has been manually specified."
;
; Supplying the profile UUID is what switches Godot to manual signing and makes
; the explicit identity legal. The UUID is not committed because it changes
; every time the profile is regenerated; CI reads it out of the profile it just
; installed, so a new profile is picked up with no edit here.
;
; Left blank in git so the unsigned path keeps working for anyone without
; secrets. That path disables signing entirely, so these are irrelevant to it.
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
; 0 = App Store (the enum is App Store, Development, Ad-Hoc, Enterprise).
application/export_method_debug=1
application/export_method_release=0
capabilities/access_wifi=false
capabilities/push_notifications=false
