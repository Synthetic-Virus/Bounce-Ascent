[preset.2.options]

custom_template/debug=""
custom_template/release=""
architectures/device=true
architectures/simulator=false
; PLACEHOLDER. Godot validates this field and refuses the iOS export without
; it, even for an unsigned build that only emits an Xcode project. Replace with
; the real ten-character Team ID from developer.apple.com once enrolled; until
; then the generated project builds but cannot be signed or installed.
application/app_store_team_id="0000000000"
application/bundle_identifier="org.virusgaming.bounceascent"
application/signature=""
application/short_version="2.0.0"
application/version="2.0.0"
application/is_resizable=false
application/icon_interpolation=4
application/launch_screens_interpolation=4
; TRUE so Godot emits the Xcode project and STOPS.
;
; With this false it goes on to run `xcodebuild archive`, which cannot succeed
; without a signing identity and failed CI with "ARCHIVE FAILED". Exporting the
; project only is exactly what an unsigned pipeline should produce: something
; you can open in Xcode and sign yourself once enrolled.
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
capabilities/access_wifi=false
capabilities/push_notifications=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""
orientation/portrait=true
orientation/landscape_left=false
orientation/landscape_right=false
orientation/portrait_upside_down=false
storyboard/use_launch_screen_storyboard=true
storyboard/image_scale_mode=0
storyboard/custom_bg_color=Color(0.027, 0.012, 0.059, 1)
